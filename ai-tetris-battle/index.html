<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雙電腦對戰俄羅斯方塊</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Noto Sans TC","PingFang TC",sans-serif;font-size:22px;color:#fff;background:linear-gradient(160deg,#2b1055,#7597de);min-height:100vh;overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto;padding:10px}
h1{font-size:30px;text-align:center;margin:8px 0;text-shadow:0 3px 0 #ff3d7f}
h2{font-size:26px;margin:6px 0}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:8px 0}
button,select{font-size:20px;min-height:48px;min-width:48px;padding:6px 14px;border:0;border-radius:14px;font-weight:700;cursor:pointer;color:#222}
#start{background:#4ade80}#pause{background:#facc15}#restart{background:#f87171}
label{font-size:19px}
input[type=range]{width:150px;height:44px;vertical-align:middle}
.arena{display:flex;gap:8px;justify-content:center}
.side{flex:1 1 0;min-width:0;max-width:420px;background:rgba(0,0,0,.28);border-radius:16px;padding:8px;text-align:center}
.side.p1{border:3px solid #22d3ee}.side.p2{border:3px solid #f472b6}
.side h2{font-size:22px}
.stats{font-size:18px;line-height:1.35}
.stats b{font-size:20px;color:#fde68a}
.row{display:flex;flex-direction:column-reverse;gap:4px;align-items:center}
.nextbox{display:flex;gap:6px;align-items:center}
canvas.board{width:100%;max-width:300px;height:auto;aspect-ratio:1/2;background:#0b1026;border-radius:8px;display:block}
.nextbox{font-size:17px}
canvas.next{width:44px;height:44px;background:#0b1026;border-radius:6px;display:block}
.status{font-size:24px;text-align:center;min-height:34px;font-weight:700;color:#fde68a;margin:6px 0}
.help{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 14px;margin-top:12px}
.help li{margin:4px 0}
@media (min-width:700px){.row{flex-direction:row;align-items:flex-start;justify-content:center}.nextbox{flex-direction:column}canvas.next{width:72px;height:72px}.stats{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🤖 雙電腦對戰俄羅斯方塊 🤖</h1>
<div class="controls">
<button id="start">開始</button><button id="pause">暫停</button><button id="restart">重新開始</button>
<label>速度 <input type="range" id="speed" min="1" max="10" value="5"></label>
</div>
<div class="status" id="status">按「開始」觀看 AI 對決！</div>
<div class="arena" id="arena"></div>
<div class="help">
<h2>玩法說明</h2>
<ul>
<li>左右兩台電腦會自動玩俄羅斯方塊，你只要觀戰！</li>
<li>每台 AI 會試遍所有旋轉與位置，挑出高度低、洞少、表面平的落點。</li>
<li>一次消 2 行送對手 1 行垃圾，3 行送 2 行，4 行送 4 行。</li>
<li>先被堆到頂的一方輸，3 秒後自動開下一局。</li>
<li>可調整速度，並替兩邊各選難度：簡單會犯錯、困難會偷看下一塊。</li>
</ul>
</div>
</div>
<script>
(()=>{
const W=10,H=20;
const COLORS={I:'#22d3ee',O:'#facc15',T:'#c084fc',S:'#4ade80',Z:'#f87171',J:'#60a5fa',L:'#fb923c',G:'#6b7280'};
const BASE={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const SHAPES={};
for(const k in BASE){const n=k==='I'?4:k==='O'?4:3;let r=BASE[k];SHAPES[k]=[];for(let i=0;i<4;i++){SHAPES[k].push(r);r=r.map(([x,y])=>[n-1-y,x]);}}
const WEIGHTS={
 easy:{h:-0.3,l:0.5,o:-0.25,b:-0.1,err:0.3,look:false},
 normal:{h:-0.51,l:0.76,o:-0.36,b:-0.18,err:0.04,look:false},
 hard:{h:-0.51,l:0.76,o:-0.36,b:-0.18,err:0,look:true}};
const GARB={2:1,3:2,4:4};
const wins=[0,0];let running=false,paused=false,over=false,nextRoundT=null;
const speedEl=document.getElementById('speed'),statusEl=document.getElementById('status');
const players=[];
function bag(p){if(!p.bag.length){p.bag='IOTSZJL'.split('');for(let i=6;i>0;i--){const j=Math.random()*(i+1)|0;[p.bag[i],p.bag[j]]=[p.bag[j],p.bag[i]];}}return p.bag.pop();}
function fits(g,t,r,x,y){for(const[cx,cy]of SHAPES[t][r]){const X=x+cx,Y=y+cy;if(X<0||X>=W||Y>=H)return false;if(Y>=0&&g[Y][X])return false;}return true;}
function dropY(g,t,r,x){let y=-2;if(!fits(g,t,r,x,y))return null;while(fits(g,t,r,x,y+1))y++;return y;}
function place(g,t,r,x,y){const n=g.map(row=>row.slice());let top=false;for(const[cx,cy]of SHAPES[t][r]){if(y+cy<0)top=true;else n[y+cy][x+cx]=t;}let l=0;const out=n.filter(row=>!row.every(c=>c));l=H-out.length;while(out.length<H)out.unshift(Array(W).fill(0));return{g:out,l,top};}
function evalG(g,l,w){let agg=0,holes=0,bump=0,prev=-1;for(let x=0;x<W;x++){let h=0,seen=false;for(let y=0;y<H;y++){if(g[y][x]){if(!seen){h=H-y;seen=true;}}else if(seen)holes++;}agg+=h;if(prev>=0)bump+=Math.abs(h-prev);prev=h;}return w.h*agg+w.l*l+w.o*holes+w.b*bump;}
function moves(g,t){const res=[];for(let r=0;r<4;r++)for(let x=-2;x<W;x++){const y=dropY(g,t,r,x);if(y===null)continue;const p=place(g,t,r,x,y);if(p.top)continue;res.push({r,x,y,p});}return res;}
function best(g,t,nx,w){const ms=moves(g,t);if(!ms.length)return null;if(Math.random()<w.err)return ms[Math.random()*ms.length|0];let b=null,bs=-1e9;for(const m of ms){let s=evalG(m.p.g,m.p.l,w);if(w.look&&nx){let s2=-1e9;for(const m2 of moves(m.p.g,nx)){const v=evalG(m2.p.g,m2.p.l+m.p.l,w);if(v>s2)s2=v;}s=s2;}if(s>bs){bs=s;b=m;}}return b;}
function mkPlayer(i){
 const el=document.createElement('div');el.className='side p'+(i+1);
 el.innerHTML=`<h2>${i?'🔴 電腦 B':'🔵 電腦 A'}</h2><select aria-label="難度"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select>
 <div class="row" style="margin-top:6px"><canvas class="board" width="200" height="400"></canvas><div class="nextbox">下一個<canvas class="next" width="80" height="80"></canvas></div></div>
 <div class="stats">分數 <b class="sc">0</b><br>行數 <b class="ln">0</b><br>勝場 <b class="wn">0</b></div>`;
 document.getElementById('arena').appendChild(el);
 const p={i,el,diff:el.querySelector('select'),cv:el.querySelector('.board'),nv:el.querySelector('.next'),bag:[]};
 if(i===1)p.diff.value='hard';
 players.push(p);return p;}
function reset(p){p.g=Array.from({length:H},()=>Array(W).fill(0));p.bag=[];p.score=0;p.lines=0;p.garbSent=0;p.pend=0;p.next=bag(p);p.dead=false;spawn(p);}
function spawn(p){p.t=p.next;p.next=bag(p);p.r=0;p.x=3;p.y=-1;p.plan=null;
 if(!fits(p.g,p.t,0,3,-1)){p.dead=true;return;}
 p.plan=best(p.g,p.t,p.next,WEIGHTS[p.diff.value]);if(!p.plan)p.dead=true;}
function addGarbage(p,n){for(let k=0;k<n;k++){if(p.g[0].some(c=>c))p.dead=true;p.g.shift();const row=Array(W).fill('G');row[Math.random()*W|0]=0;p.g.push(row);}}
function step(p){ // one AI action
 if(p.dead)return;const pl=p.plan;
 if(p.r!==pl.r&&fits(p.g,p.t,(p.r+1)%4,p.x,p.y)){p.r=(p.r+1)%4;return;}
 if(p.x!==pl.x){const dx=Math.sign(pl.x-p.x);if(fits(p.g,p.t,p.r,p.x+dx,p.y)){p.x+=dx;return;}}
 if(fits(p.g,p.t,p.r,p.x,p.y+1)){p.y++;return;}
 lock(p);}
function lock(p){const res=place(p.g,p.t,p.r,p.x,p.y);if(res.top){p.dead=true;return;}p.g=res.g;
 if(res.l){p.lines+=res.l;p.score+=[0,100,300,500,800][res.l];const s=GARB[res.l]||0;if(s){p.garbSent+=s;players[1-p.i].pend+=s;}}
 if(p.pend){addGarbage(p,p.pend);p.pend=0;}
 if(!p.dead)spawn(p);}
function cell(c,x,y,s,col,a){c.globalAlpha=a||1;c.fillStyle=col;c.fillRect(x*s+1,y*s+1,s-2,s-2);c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x*s+1,y*s+1,s-2,s/5);c.globalAlpha=1;}
function draw(p){const c=p.cv.getContext('2d'),s=20;c.clearRect(0,0,200,400);c.strokeStyle='rgba(255,255,255,.06)';for(let x=0;x<=W;x++){c.beginPath();c.moveTo(x*s,0);c.lineTo(x*s,400);c.stroke();}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(p.g[y][x])cell(c,x,y,s,COLORS[p.g[y][x]]);
 if(!p.dead&&p.plan){for(const[cx,cy]of SHAPES[p.t][p.plan.r])if(p.plan.y+cy>=0)cell(c,p.plan.x+cx,p.plan.y+cy,s,COLORS[p.t],.2);
  for(const[cx,cy]of SHAPES[p.t][p.r])if(p.y+cy>=0)cell(c,p.x+cx,p.y+cy,s,COLORS[p.t]);}
 if(p.dead){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,150,200,90);c.fillStyle='#fff';c.font='bold 30px sans-serif';c.textAlign='center';c.fillText('爆掉了！',100,205);}
 const n=p.nv.getContext('2d');n.clearRect(0,0,80,80);for(const[cx,cy]of SHAPES[p.next][0])cell(n,cx+.1,cy+1,18,COLORS[p.next]);
 p.el.querySelector('.sc').textContent=p.score;p.el.querySelector('.ln').textContent=p.lines;p.el.querySelector('.wn').textContent=wins[p.i];}
let acc=0,last=0;
function loop(ts){const dt=Math.min(100,ts-last);last=ts;
 if(running&&!paused&&!over){const v=+speedEl.value;const rate=v>=10?3000:Math.pow(2.2,v)*1.5;acc+=dt/1000*rate;let n=Math.min(acc|0,4000);acc-=n;
  while(n-->0&&!over){for(const p of players)step(p);checkEnd();}}
 players.forEach(draw);requestAnimationFrame(loop);}
function checkEnd(){const d=players.map(p=>p.dead);if(!d[0]&&!d[1])return;over=true;
 let msg;if(d[0]&&d[1])msg='平手！';else{const w=d[0]?1:0;wins[w]++;msg=(w?'🔴 電腦 B':'🔵 電腦 A')+' 獲勝！🎉';}
 statusEl.textContent=msg+' 3 秒後下一局…';nextRoundT=setTimeout(newRound,3000);}
function newRound(){clearTimeout(nextRoundT);players.forEach(reset);over=false;acc=0;statusEl.textContent='對戰中！';}
document.getElementById('start').onclick=()=>{if(!running){running=true;paused=false;newRound();}else if(paused){paused=false;pauseBtn.textContent='暫停';statusEl.textContent='對戰中！';}};
const pauseBtn=document.getElementById('pause');
pauseBtn.onclick=()=>{if(!running||over)return;paused=!paused;pauseBtn.textContent=paused?'繼續':'暫停';statusEl.textContent=paused?'已暫停':'對戰中！';};
document.getElementById('restart').onclick=()=>{wins[0]=wins[1]=0;running=true;paused=false;pauseBtn.textContent='暫停';newRound();};
mkPlayer(0);mkPlayer(1);players.forEach(reset);
window.__game={players,wins,state:()=>({running,paused,over})};
requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
</body>
</html>
